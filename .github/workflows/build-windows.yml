name: Build, Test & Release Windows 11

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Semantic version (e.g. 1.0.1). Leave blank to auto-derive."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Qt 6 (MSVC 2022 x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.2"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"
          modules: "qtmultimedia qtshadertools"

      - name: Determine Release Version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.release_version }}"
          if ([string]::IsNullOrWhiteSpace($v)) {
            if ("${{ github.ref_type }}" -eq "tag") {
              $v = "${{ github.ref_name }}".TrimStart("v")
            } else {
              $v = "1.0.${{ github.run_number }}"
            }
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building Aether Launcher v$v"

      - name: Configure MSVC Environment & CMake
        shell: pwsh
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" `
            -DAETHER_VERSION="${{ steps.ver.outputs.version }}" `
            -DAETHER_BUILD_TESTS=ON

      - name: Build AetherLauncher, AetherUpdater & Unit Tests
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Run Automated Unit Test Suite
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage Windows 11 Portable Release Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/AetherLauncher | Out-Null
          Copy-Item build/Release/AetherLauncher.exe dist/AetherLauncher/
          Copy-Item build/Release/AetherUpdater.exe dist/AetherLauncher/
          & "$env:Qt6_DIR/bin/windeployqt.exe" `
            --release `
            --qmldir src/ui/qml `
            dist/AetherLauncher/AetherLauncher.exe
          Compress-Archive -Path dist/AetherLauncher/* -DestinationPath dist/AetherLauncher-win64.zip -Force

      - name: Generate Verified Update Manifest (SHA-256)
        id: manifest
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $zipPath = "dist/AetherLauncher-win64.zip"
          $hash = (Get-FileHash -Algorithm SHA256 $zipPath).Hash.ToLower()
          $size = (Get-Item $zipPath).Length
          $repo = "${{ github.repository }}"
          $downloadUrl = "https://github.com/$repo/releases/download/v$ver/AetherLauncher-win64.zip"
          $notes = (git log -n 5 --pretty=format:"- %s") -join "`n"

          $manifest = [ordered]@{
            version       = $ver
            releaseDate   = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            releaseNotes  = $notes
            downloadUrl   = $downloadUrl
            sha256        = $hash
            fileSizeBytes = $size
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Path dist/manifest.json -Encoding UTF8
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AetherLauncher-win64-v${{ steps.manifest.outputs.version }}
          path: |
            dist/AetherLauncher-win64.zip
            dist/manifest.json

      - name: Publish GitHub Release (Main Branch & Tags)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.manifest.outputs.version }}
          name: Aether Launcher v${{ steps.manifest.outputs.version }}
          generate_release_notes: true
          files: |
            dist/AetherLauncher-win64.zip
            dist/manifest.json
